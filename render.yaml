services:
  - type: web
    name: resqflow-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: resqflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://REPLACE-WITH-YOUR-FRONTEND-URL

  - type: web
    name: resqflow-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://REPLACE-WITH-YOUR-BACKEND-URL

databases:
  - name: resqflow-db
    plan: free
